[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gladiator-options"
version = "0.1.0"
description = "Autonomous competing options trading agents for Schwab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "schwab-py>=1.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "ccxt>=4.2.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "feedparser>=6.0.0",
    "aiohttp>=3.9.0",
    "asyncio-mqtt>=0.16.0",
    "apscheduler>=3.10.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "mibian>=0.1.3",
    "scipy>=1.12.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.scripts]
gladiator = "src.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
